<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Admin EPIs CBMMG</title>
  <link rel="stylesheet" href="/static/admin/css/admin.css">
  <link rel="icon" type="image/png" href="/static/admin/img/logo.png">
</head>
<body class="login-body">
  <div class="login-box">
    <img class="logo-login" src="/static/admin/img/logo.png" alt="Corpo de Bombeiros Militar de Minas Gerais" width="112" height="112">
    <p class="brand-line">CBMMG · Controle de EPIs</p>
    <h1>Acesso administrativo</h1>
    <p class="sub">Aprove ou rejeite alterações de posse de material.</p>
    {% if erro %}
    <p class="alert-err">{{ erro }}</p>
    {% endif %}
    <form method="post" action="/admin/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label>Usuário
        <input type="text" name="username" autocomplete="username" required>
      </label>
      <label>Senha
        <div class="password-wrapper">
          <input type="password" id="passwordInput" name="password" autocomplete="current-password" required>
          <button type="button" class="btn-toggle-password" id="togglePassword" aria-label="Exibir senha" title="Exibir senha">
            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg id="eyeOffIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: none;">
              <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/>
              <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/>
              <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/>
              <line x1="2" x2="22" y1="2" y2="22"/>
            </svg>
          </button>
        </div>
      </label>
      <button type="submit" class="btn-primary">Entrar</button>
    </form>
  </div>
  <script>
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');
    const eyeOffIcon = document.getElementById('eyeOffIcon');

    if (togglePasswordBtn && passwordInput) {
      togglePasswordBtn.addEventListener('click', function () {
        const isPassword = passwordInput.type === 'password';
        passwordInput.type = isPassword ? 'text' : 'password';
        eyeIcon.style.display = isPassword ? 'none' : 'block';
        eyeOffIcon.style.display = isPassword ? 'block' : 'none';
        const label = isPassword ? 'Ocultar senha' : 'Exibir senha';
        togglePasswordBtn.setAttribute('aria-label', label);
        togglePasswordBtn.setAttribute('title', label);
        passwordInput.focus();
        const len = passwordInput.value.length;
        if (passwordInput.setSelectionRange) {
          passwordInput.setSelectionRange(len, len);
        }
      });
    }
  </script>
</body>
</html>
